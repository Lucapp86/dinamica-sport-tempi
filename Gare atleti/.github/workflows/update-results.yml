name: Aggiorna Risultati Nuoto

on:
  schedule:
    # Ogni domenica alle 21:30 UTC e lunedi alle 08:30 UTC
    - cron: "30 21 * * 0"
    - cron: "30 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Scarica risultati da nuotopiemonte-uisp.it e cifra dataset
        shell: pwsh
        env:
          TEAM_PASSWORD: ${{ secrets.TEAM_PASSWORD }}
          MANUAL_CSV_URL: ${{ secrets.MANUAL_CSV_URL }}
        run: |
          ./scripts/update_results.ps1

      - name: Commit e push se ci sono nuovi dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.com"
          if git status --porcelain data/team-data.enc.json | grep -q .; then
            git add data/team-data.enc.json
            git commit -m "Aggiorna risultati Dinamica Sport"
            git push
          else
            echo "Nessun nuovo risultato trovato."
          fi
